name: evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_heldout:
        description: "Ejecutar la medición congelada (solo decisión final, nunca calibración)"
        required: false
        type: boolean
        default: false

jobs:
  tests:
    name: suite Labs (contratos y servicio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt
      - name: Dependencias de tests
        run: |
          pip install -r evals/requirements.txt pytest fastapi httpx scipy "mcp>=1.0"
      - name: Suite completa de Labs
        run: python -m pytest tests -q

  baseline:
    name: baseline dev (gate rápido, sin modelo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt
      - run: pip install "PyYAML==6.0.3"
      - name: Contratos multi-territorio
        run: |
          python -m unittest discover -s tests -p 'test_eval_contract.py'
          python -m unittest discover -s tests -p 'test_territory_registry.py'
      # Solo development: el held-out no se observa en cada cambio.
      - run: python evals/run.py --retriever baseline --lang es --min-pass 70
      - run: python evals/run.py --retriever baseline --lang eu --min-pass 66
      - name: Madrid dev (primer pack oficial)
        run: python evals/run.py --retriever baseline --territory madrid --lang es --min-pass 75

  hybrid:
    name: hybrid dev (perfiles reproducibles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt
      - name: Caché de modelos de embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('evals/requirements.txt', 'evals/retriever-config.json') }}
          restore-keys: fastembed-
      - run: pip install -r evals/requirements.txt
      - name: MiniLM dev (referencia legacy)
        run: |
          python evals/run.py --retriever hybrid --profile minilm --lang es --min-pass 73
          python evals/run.py --retriever hybrid --profile minilm --lang eu --min-pass 68
          python evals/run.py --retriever hybrid --profile minilm --territory madrid --lang es --min-pass 85
      - name: e5-large dev (perfil de producción)
        run: |
          python evals/run.py --retriever hybrid --profile e5large --lang es --min-pass 73
          python evals/run.py --retriever hybrid --profile e5large --lang eu --min-pass 68
      - name: e5-large challenge (informativo)
        run: |
          python evals/run.py --retriever hybrid --profile e5large --lang es --split challenge || true
          python evals/run.py --retriever hybrid --profile e5large --lang eu --split challenge || true

  heldout:
    name: held-out congelado (solo manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_heldout }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt
      - name: Caché de modelos de embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('evals/requirements.txt', 'evals/retriever-config.json') }}
          restore-keys: fastembed-
      - run: pip install -r evals/requirements.txt
      - name: Baseline held-out
        run: |
          python evals/run.py --retriever baseline --lang es --split heldout --min-pass 55
          python evals/run.py --retriever baseline --lang eu --split heldout --min-pass 50
      - name: e5-large held-out
        run: |
          python evals/run.py --retriever hybrid --profile e5large --lang es --split heldout --min-pass 70
          python evals/run.py --retriever hybrid --profile e5large --lang eu --split heldout --min-pass 68
