name: evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  baseline:
    name: baseline (gate rápido, sin modelo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt
      - run: pip install pyyaml
      # Umbrales = resultado medido − margen de ruido; si bajan, algo se rompió.
      # Actualizados 2026-08-05: corpus curado (v1, 139 casos) desplegado con
      # e5-large en 22 capas. Baseline no usa modelo → inmutable.
      # Baseline: keywords+geo, sin modelo. ES: dev 74%/heldout 58%;
      # EU: dev 71%/heldout 52% (consultas EU más difíciles para keywords).
      - run: python evals/run.py --retriever baseline --lang es --min-pass 70
      - run: python evals/run.py --retriever baseline --lang eu --min-pass 66
      - run: python evals/run.py --retriever baseline --lang es --split heldout --min-pass 55
      - run: python evals/run.py --retriever baseline --lang eu --split heldout --min-pass 50

  hybrid:
    name: hybrid (semántico, con caché de modelo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt
      - name: Caché de modelos de embeddings (minilm + e5-large)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-models-${{ hashFiles('evals/requirements.txt') }}
          restore-keys: fastembed-models-
      - run: pip install -r evals/requirements.txt
      # MiniLM (modelo legacy, 2026-08-05): vigila regresión del baseline
      # semántico. Ya no es el modelo de producción (e5-large), pero si estos
      # gates caen, algo se rompió en el harness o los datos.
      # Medido 2026-08-05: es=76%, eu=71% dev; es=58%, eu=63% heldout.
      - run: python evals/run.py --retriever hybrid --lang es --min-pass 73
      - run: python evals/run.py --retriever hybrid --lang eu --min-pass 68
      - run: python evals/run.py --retriever hybrid --lang es --split heldout --min-pass 55
      - run: python evals/run.py --retriever hybrid --lang eu --split heldout --min-pass 60
      # e5-large (modelo en producción desde 2026-08-05): 22 capas, calibración
      # τ=0.80, tie=0.01.
      # Gate duro sobre heldout original (54 casos congelados, sin mirar para
      # calibrar): ES 73%, EU 71%. Si cae, el modelo o los datos empeoraron.
      - name: Eval e5-large (gate duro, heldout congelado)
        env:
          EMAP_EMBED_MODEL: intfloat/multilingual-e5-large
        run: |
          python evals/run.py --retriever hybrid --lang es --split heldout --min-pass 70
          python evals/run.py --retriever hybrid --lang eu --split heldout --min-pass 68
          python evals/run.py --retriever hybrid --lang es --min-pass 73
          python evals/run.py --retriever hybrid --lang eu --min-pass 68
      # Challenge split (48 casos nuevos, post-calibración): informativo, sin
      # gate duro. Reporta cobertura de nuevas capas y edge cases.
      # Medido: ~64% (incluye casos aspiracionales donde debe abstenerse).
      - name: Eval e5-large (challenge, informativo)
        env:
          EMAP_EMBED_MODEL: intfloat/multilingual-e5-large
        run: |
          python evals/run.py --retriever hybrid --lang es --split challenge || true
          python evals/run.py --retriever hybrid --lang eu --split challenge || true
