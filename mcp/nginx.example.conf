# Snippets de nginx para emap-mcp (streamable-http en 127.0.0.1:8084).
# Elegir UNA topología cuando se decida el dominio de producto.
# Requisitos comunes: proxy_buffering off, HTTP/1.1, timeouts largos.
# El location /health es opcional (liveness sin protocolo MCP).

# ── A) Prod actual: path en dominio personal ──────────────────────────
# server { server_name gaizkajimenez.com; ...
#   location /mcp {
#       proxy_pass http://127.0.0.1:8084;
#       include snippets/emap-mcp-proxy.conf;   # o pegar bloque abajo
#   }
#   location = /mcp-health {
#       proxy_pass http://127.0.0.1:8084/health;
#   }
# }

# ── B) Recomendado: subdominio de producto ────────────────────────────
# DNS: mcp.emapapp.com → IP del VPS; certbot -d mcp.emapapp.com
#
# server {
#     listen 443 ssl http2;
#     server_name mcp.emapapp.com;
#     # ssl_certificate ... (certbot)
#
#     location /mcp {
#         proxy_pass http://127.0.0.1:8084;
#         proxy_http_version 1.1;
#         proxy_set_header Connection '';
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_buffering off;
#         proxy_cache off;
#         proxy_read_timeout 300s;
#         proxy_send_timeout 300s;
#     }
#
#     location = /health {
#         proxy_pass http://127.0.0.1:8084/health;
#         proxy_set_header Host $host;
#     }
# }

# ── C) Path en apex de producto (emapapp.com/mcp) ─────────────────────
# Si el apex vive en Vercel, NO montar el MCP ahí: streamable-http + SSE
# no encaja bien en serverless. Preferir B, o un reverse proxy en el VPS
# con el apex apuntando al VPS solo para /mcp (split difícil).
#
# Si emapapp.com termina en el VPS:
#   location /mcp { proxy_pass http://127.0.0.1:8084; ... igual que arriba }

# ── Bloque proxy reutilizable (copiar dentro de location) ─────────────
# proxy_http_version 1.1;
# proxy_set_header Connection '';
# proxy_set_header Host $host;
# proxy_set_header X-Real-IP $remote_addr;
# proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# proxy_set_header X-Forwarded-Proto $scheme;
# proxy_buffering off;
# proxy_cache off;
# proxy_read_timeout 300s;
# proxy_send_timeout 300s;

# ── Rate limit opcional (abuso; API pública sin auth) ─────────────────
